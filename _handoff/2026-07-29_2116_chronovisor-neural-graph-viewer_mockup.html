<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CHRONOVISOR // SYNAPTIC CORTEX</title>
<style>
:root{
  --bg:#04060b; --panel:rgba(8,12,20,.82); --panel2:rgba(11,16,27,.92);
  --line:rgba(110,140,190,.12); --amber:#ffb454; --amber2:#f5934b;
  --steel:#7d92b5; --tx:#c9d6ee; --tx2:#7f90b0; --tx3:#4d5b76;
  --mono:"SF Mono",ui-monospace,Menlo,Consolas,"Cascadia Code",monospace;
  --sans:-apple-system,"Hiragino Sans","Yu Gothic UI",Segoe UI,sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden}
body{background:var(--bg);color:var(--tx);font-family:var(--sans);font-size:13px}

#app{display:grid;grid-template-rows:52px 1fr;height:100%}
#main{display:grid;grid-template-columns:242px 1fr 296px;min-height:0}
@media(max-width:1180px){#main{grid-template-columns:206px 1fr 256px}}

/* ---------- header ---------- */
header{display:flex;align-items:center;gap:14px;padding:0 14px;
  background:linear-gradient(180deg,rgba(11,16,28,.96),rgba(6,9,16,.96));
  border-bottom:1px solid var(--line);position:relative;z-index:30}
header::after{content:"";position:absolute;left:0;right:0;bottom:-1px;height:1px;
  background:linear-gradient(90deg,transparent,rgba(255,180,84,.45) 50%,transparent)}
#brand{display:flex;align-items:center;gap:10px;white-space:nowrap}
#logo{width:26px;height:26px;flex:none}
#brand h1{font:700 15px var(--mono);letter-spacing:.12em;
  background:linear-gradient(90deg,var(--amber),#ffd9a0);
  -webkit-background-clip:text;background-clip:text;color:transparent}
#brand small{display:block;font:500 8.5px var(--mono);letter-spacing:.34em;color:var(--tx3);margin-top:1px}
#searchWrap{position:relative;flex:0 1 320px;min-width:150px}
#search{width:100%;padding:7px 30px 7px 30px;border-radius:8px;border:1px solid var(--line);
  background:rgba(4,7,13,.85);color:var(--tx);font:12px var(--mono);outline:none;transition:.2s}
#search:focus{border-color:rgba(255,180,84,.5);box-shadow:0 0 14px rgba(255,180,84,.12)}
#searchWrap::before{content:"⌕";position:absolute;left:10px;top:5px;color:var(--tx3);font-size:14px}
#searchHits{position:absolute;right:9px;top:7px;font:10px var(--mono);color:var(--amber)}
#hstats{margin-left:auto;display:flex;align-items:center;gap:14px;font:11px var(--mono);color:var(--tx2);white-space:nowrap}
#hstats b{color:var(--tx);font-weight:600}
#stSp{color:var(--amber)!important}
.badge{display:flex;align-items:center;gap:6px;padding:4px 10px;border-radius:20px;
  border:1px solid rgba(255,180,84,.35);color:var(--amber);font:10px var(--mono);letter-spacing:.08em}
.badge i{width:6px;height:6px;border-radius:50%;background:var(--amber);animation:pulse 1.6s infinite}
@keyframes pulse{0%,100%{box-shadow:0 0 0 0 rgba(255,180,84,.5)}50%{box-shadow:0 0 0 5px rgba(255,180,84,0)}}
.chip{padding:3px 8px;border-radius:6px;border:1px solid var(--line);font:10px var(--mono);color:var(--tx3)}

/* ---------- sidebar ---------- */
#side{background:var(--panel);border-right:1px solid var(--line);display:flex;flex-direction:column;min-height:0;z-index:20}
.paneTitle{padding:10px 14px 8px;font:600 9.5px var(--mono);letter-spacing:.3em;color:var(--tx3);
  display:flex;justify-content:space-between;align-items:center}
#tree{overflow-y:auto;flex:1;padding-bottom:20px}
#tree::-webkit-scrollbar,#panelBody::-webkit-scrollbar{width:8px}
#tree::-webkit-scrollbar-thumb,#panelBody::-webkit-scrollbar-thumb{background:rgba(110,140,190,.15);border-radius:4px}
.pkgRow{display:flex;align-items:center;gap:8px;padding:6px 12px;cursor:pointer;user-select:none;
  font:12px var(--mono);color:var(--tx);transition:background .15s}
.pkgRow:hover{background:rgba(110,140,190,.06)}
.pkgRow .dot{width:8px;height:8px;border-radius:50%;flex:none;cursor:pointer;box-shadow:0 0 6px rgba(125,146,181,.5)}
.pkgRow.off .dot{background:transparent!important;box-shadow:none;border:1px solid var(--tx3)}
.pkgRow.off{opacity:.4}
.pkgRow .n{flex:1}
.pkgRow .c{font-size:10px;color:var(--tx3)}
.pkgRow .ar{font-size:9px;color:var(--tx3);transition:transform .2s}
.pkgRow.open .ar{transform:rotate(90deg)}
.modList{display:none;border-left:1px solid var(--line);margin-left:19px}
.modList.open{display:block}
.modRow{display:flex;align-items:center;gap:6px;padding:3.5px 10px 3.5px 12px;cursor:pointer;
  font:11px var(--mono);color:var(--tx2);white-space:nowrap;overflow:hidden}
.modRow:hover{background:rgba(110,140,190,.07);color:var(--tx)}
.modRow.sel{background:rgba(255,180,84,.12);color:var(--amber)}
.modRow .l{margin-left:auto;font-size:9px;color:var(--tx3)}
.modRow .ep{color:var(--amber2);font-size:9px;opacity:.7}

/* ---------- stage ---------- */
#stage{position:relative;min-width:0;background:
  radial-gradient(1000px 680px at 50% 44%,#080d18 0%,#04060b 70%)}
canvas#gl{position:absolute;inset:0;width:100%;height:100%;display:block}
#scan{pointer-events:none;position:absolute;inset:0;z-index:5;opacity:.045;
  background:repeating-linear-gradient(0deg,transparent 0 2px,#8fb0e0 2px 3px)}
.hudCorner{position:absolute;width:22px;height:22px;z-index:6;pointer-events:none;opacity:.45}
.hudCorner::before,.hudCorner::after{content:"";position:absolute;background:var(--amber)}
.hudCorner::before{width:100%;height:1px}.hudCorner::after{width:1px;height:100%}
#c1{top:10px;left:10px}#c2{top:10px;right:10px;transform:scaleX(-1)}
#c3{bottom:10px;left:10px;transform:scaleY(-1)}#c4{bottom:10px;right:10px;transform:scale(-1)}

#modeBar{position:absolute;top:14px;left:50%;transform:translateX(-50%);z-index:10;
  display:flex;gap:10px;align-items:center;flex-wrap:wrap;justify-content:center}
.seg{display:flex;background:var(--panel2);border:1px solid var(--line);border-radius:9px;overflow:hidden;
  backdrop-filter:blur(8px)}
.seg button{padding:6px 13px;border:0;background:transparent;color:var(--tx2);
  font:11px var(--mono);letter-spacing:.06em;cursor:pointer;transition:.2s}
.seg button:hover{color:var(--tx)}
.seg button.on{background:linear-gradient(180deg,rgba(255,180,84,.2),rgba(255,180,84,.07));color:var(--amber)}
.seg button.stim{color:var(--tx2)}
.seg button.stim:active{background:rgba(255,180,84,.3);color:#fff}
.tgl{display:flex;align-items:center;gap:6px;padding:6px 11px;border-radius:9px;cursor:pointer;user-select:none;
  background:var(--panel2);border:1px solid var(--line);font:10.5px var(--mono);color:var(--tx2);backdrop-filter:blur(8px)}
.tgl i{width:14px;height:8px;border-radius:5px;background:#1e2941;position:relative;transition:.2s;flex:none}
.tgl i::after{content:"";position:absolute;width:8px;height:8px;border-radius:50%;left:0;top:0;background:#4d5b76;transition:.2s}
.tgl.on{color:var(--tx)}
.tgl.on i{background:rgba(255,180,84,.4)}
.tgl.on i::after{left:6px;background:var(--amber)}
#visCtl{display:flex;align-items:center;gap:7px;padding:6px 11px;border-radius:9px;
  background:var(--panel2);border:1px solid var(--line);font:10.5px var(--mono);color:var(--tx2);backdrop-filter:blur(8px)}
#visCtl input{width:74px;height:3px;accent-color:var(--amber);cursor:pointer}

#zoomCtl{position:absolute;right:14px;bottom:44px;z-index:10;display:flex;flex-direction:column;gap:6px}
#zoomCtl button{width:32px;height:32px;border-radius:8px;border:1px solid var(--line);cursor:pointer;
  background:var(--panel2);color:var(--tx2);font:15px var(--mono);backdrop-filter:blur(8px);transition:.2s}
#zoomCtl button:hover{color:var(--amber);border-color:rgba(255,180,84,.4)}

#ticker{position:absolute;left:14px;bottom:12px;z-index:10;display:flex;align-items:center;gap:8px;
  font:10.5px var(--mono);color:var(--tx3);max-width:58%;white-space:nowrap;overflow:hidden}
#ticker .cur{width:7px;height:12px;background:var(--amber);animation:blink 1.1s steps(1) infinite;flex:none}
@keyframes blink{50%{opacity:0}}
#tickerTx{color:var(--tx2);transition:opacity .35s}
#genInfo{position:absolute;right:14px;bottom:12px;z-index:10;font:9.5px var(--mono);color:var(--tx3)}

#tooltip{position:absolute;z-index:40;pointer-events:none;display:none;
  background:var(--panel2);border:1px solid rgba(255,180,84,.3);border-radius:8px;padding:8px 11px;
  font:11px var(--mono);box-shadow:0 8px 30px rgba(0,0,0,.5);backdrop-filter:blur(10px)}
#tooltip .t{color:var(--amber);font-weight:600;margin-bottom:3px}
#tooltip .s{color:var(--tx2);font-size:10px}

/* ---------- right panel ---------- */
#hud{background:var(--panel);border-left:1px solid var(--line);display:flex;flex-direction:column;min-height:0;z-index:20}
#panelBody{overflow-y:auto;flex:1;padding:0 14px 20px}
.sec{margin-top:14px}
.sec h3{font:600 9px var(--mono);letter-spacing:.28em;color:var(--tx3);margin-bottom:8px;
  display:flex;align-items:center;gap:8px}
.sec h3::after{content:"";flex:1;height:1px;background:var(--line)}
#gaugeWrap{display:flex;align-items:center;gap:12px}
#gauge{width:118px;height:118px;flex:none}
.gLegend{font:10px var(--mono);color:var(--tx2);display:flex;flex-direction:column;gap:6px}
.gLegend b{color:var(--tx);font-size:12px}
.gLegend .k{display:flex;align-items:center;gap:6px}
.gLegend .sw{width:8px;height:8px;border-radius:2px}
.hubRow{display:flex;align-items:center;gap:8px;padding:3px 0;font:10.5px var(--mono);cursor:pointer;color:var(--tx2)}
.hubRow:hover{color:var(--amber)}
.hubRow .nm{width:118px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.hubRow .bar{flex:1;height:5px;border-radius:3px;background:rgba(110,140,190,.08);overflow:hidden}
.hubRow .bar i{display:block;height:100%;border-radius:3px;background:linear-gradient(90deg,#5d7196,#9fb4d8)}
.hubRow .v{width:26px;text-align:right;color:var(--tx3);font-size:9.5px}
.pkgBar{display:flex;align-items:center;gap:8px;padding:2.5px 0;font:10px var(--mono);color:var(--tx2)}
.pkgBar .nm{width:86px;color:var(--tx2)}
.pkgBar .bar{flex:1;height:4px;border-radius:2px;background:rgba(110,140,190,.07)}
.pkgBar .bar i{display:block;height:100%;border-radius:2px;background:#6b7fa3}
.pkgBar .v{width:36px;text-align:right;color:var(--tx3);font-size:9px}

#selCard{border:1px solid rgba(255,180,84,.3);border-radius:10px;padding:12px;margin-top:14px;
  background:linear-gradient(180deg,rgba(255,180,84,.07),transparent)}
#selCard .nm{font:600 13px var(--mono);color:var(--amber);word-break:break-all}
#selCard .pk{display:inline-flex;align-items:center;gap:5px;margin:7px 6px 0 0;padding:2px 8px;border-radius:10px;
  font:9.5px var(--mono);border:1px solid var(--line);color:var(--tx2)}
#selCard .pk .sw{width:7px;height:7px;border-radius:50%;background:#7d92b5}
.mrow{display:flex;justify-content:space-between;font:10.5px var(--mono);color:var(--tx2);padding:3px 0}
.mrow b{color:var(--tx)}
.depChips{display:flex;flex-wrap:wrap;gap:5px}
.depChips span{padding:2.5px 7px;border-radius:6px;font:9.5px var(--mono);cursor:pointer;
  border:1px solid var(--line);color:var(--tx2);transition:.15s;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.depChips span:hover{color:var(--amber);border-color:rgba(255,180,84,.45)}
.ghost{color:var(--tx3);font:10px var(--mono);padding:6px 0}
#closeSel{float:right;background:none;border:0;color:var(--tx3);cursor:pointer;font:12px var(--mono)}
#closeSel:hover{color:var(--amber)}

#app{animation:appIn 1.1s ease-out}
@keyframes appIn{from{opacity:0;filter:saturate(.2)}to{opacity:1}}
</style>
</head>

    <div id="brand">
      <svg id="logo" viewBox="0 0 32 32" fill="none">
        <circle cx="16" cy="16" r="13.5" stroke="#ffb454" stroke-width="1.2" stroke-dasharray="4 3" opacity=".6">
          <animateTransform attributeName="transform" type="rotate" from="0 16 16" to="360 16 16" dur="26s" repeatCount="indefinite"/>
        </circle>
        <circle cx="16" cy="16" r="8" stroke="#7d92b5" stroke-width="1" opacity=".7"/>
        <circle cx="16" cy="16" r="2.6" fill="#ffb454"/>

      <div><h1>CHRONOVISOR // SYNAPTIC CORTEX</h1><small>MEMORY FIRING MONITOR · 3D</small></div>

      <span class="badge"><i></i>CORTEX ONLINE</span>
      <span class="chip" id="stC">—</span>
    </div>
  </header>

  <div id="main">
    <nav id="side">
      <div class="paneTitle"><span>EXPLORER</span><span id="pkgCount"></span></div>
      <div id="tree"></div>
    </nav>

    <div id="stage">
      <canvas id="gl"></canvas>
      <div id="scan"></div>
      <div class="hudCorner" id="c1"></div><div class="hudCorner" id="c2"></div>

          <button class="stim" data-s="save">⚡ SAVE</button>
          <button class="stim" data-s="ingest">⚡ INGEST</button>
        </div>
        <div class="tgl on" id="tAuto"><i></i>auto</div>
        <div class="tgl on" id="tRot"><i></i>rotate</div>
        <div class="tgl" id="tSnd"><i></i>sound</div>
        <div id="visCtl"><span>synapses</span><input id="visSlider" type="range" min="30" max="420" value="160"></div>
      </div>
      <div id="zoomCtl">
        <button id="zIn">+</button><button id="zOut">−</button><button id="zFit">⌂</button>
      </div>
      <div id="ticker"><span class="cur"></span><span id="tickerTx"></span></div>
      <div id="genInfo"></div>
      <div id="tooltip"></div>
    </div>

    <aside id="hud">
      <div class="paneTitle"><span>SYSTEM MONITOR</span><span style="color:var(--amber)">● LIVE</span></div>
      <div id="panelBody"></div>
    </aside>
  </div>
</div>

/* ============ 3D layout ============ */
const pkgList=PKG_ORDER.filter(p=>nodes.some(n=>n.pkg===p));
const anchors={};
pkgList.forEach((p,i)=>{ /* fibonacci sphere */
  const k=i+.5, phi=Math.acos(1-2*k/pkgList.length), th=Math.PI*(1+Math.sqrt(5))*k;
  anchors[p]={x:Math.sin(phi)*Math.cos(th)*430, y:Math.cos(phi)*330, z:Math.sin(phi)*Math.sin(th)*430};
});

  const a=anchors[n.pkg];
  n.x=a.x*.4+(Math.random()-.5)*300;
  n.y=a.y*.4+(Math.random()-.5)*260;
  n.z=a.z*.4+(Math.random()-.5)*300;
});

/* ============ physics (3D) ============ */
let dragging=false;
function tick(){
  const rep=alpha*1500, ctr=alpha*.016;
  for(let i=0;i<N;i++){
    const a=nodes[i];
    for(let j=i+1;j<N;j++){
      const b=nodes[j];
      let dx=b.x-a.x,dy=b.y-a.y,dz=b.z-a.z;
      let d2=dx*dx+dy*dy+dz*dz;
      if(d2<1){dx=Math.random()-.5;dy=Math.random()-.5;dz=Math.random()-.5;d2=1;}
      if(d2>136900)continue;
      const d=Math.sqrt(d2), f=rep*(a.r+b.r)*.13/d2;
      const fx=dx/d*f,fy=dy/d*f,fz=dz/d*f;
      a.vx-=fx;a.vy-=fy;a.vz-=fz;b.vx+=fx;b.vy+=fy;b.vz+=fz;
    }
    /* 楕円体重力: xをやや広く */
    a.vx-=a.x*ctr*.8; a.vy-=a.y*ctr*1.25; a.vz-=a.z*ctr;
    if(mode==="cluster"){
      const an=anchors[a.pkg];
      a.vx+=(an.x-a.x)*alpha*.05;a.vy+=(an.y-a.y)*alpha*.05;a.vz+=(an.z-a.z)*alpha*.05;
    }
  }
  const kk=[.05,.012,0];
  for(const l of links){
    if(l.k===2)continue;
    const a=nodes[l.s],b=nodes[l.t];
    const dx=b.x-a.x,dy=b.y-a.y,dz=b.z-a.z;
    const d=Math.sqrt(dx*dx+dy*dy+dz*dz)||1;
    const rest=58+(a.r+b.r);
    const f=(d-rest)*kk[l.k]*alpha*(mode==="cluster"&&a.pkg!==b.pkg?.22:1);
    const fx=dx/d*f,fy=dy/d*f,fz=dz/d*f;
    a.vx+=fx;a.vy+=fy;a.vz+=fz;b.vx-=fx;b.vy-=fy;b.vz-=fz;
  }
  for(const n of nodes){
    n.vx*=.82;n.vy*=.82;n.vz*=.82;
    const v=Math.hypot(n.vx,n.vy,n.vz);
    if(v>13){const s=13/v;n.vx*=s;n.vy*=s;n.vz*=s;}
    n.x+=n.vx;n.y+=n.vy;n.z+=n.vz;
  }
  alpha=Math.max(.012,alpha*.986);
}
const reheat=a=>{alpha=Math.max(alpha,a);};

/* ============ camera (orbit) ============ */
const cam={th:.6,ph:.18,dist:1650};
let camT=null;
let FL=900;
function project(n){
  const cT=Math.cos(cam.th),sT=Math.sin(cam.th),cP=Math.cos(cam.ph),sP=Math.sin(cam.ph);
  /* (関数呼び出しコスト削減のため一括処理はprojectAllで) */
  const xr=n.x*cT+n.z*sT, zr=-n.x*sT+n.z*cT;
  const yr=n.y*cP-zr*sP, zr2=n.y*sP+zr*cP;
  const vz=cam.dist-zr2;
  if(vz<60){n.vzc=1e9;return;}
  const s=FL/vz;
  n.sx=xr*s+W/2; n.sy=yr*s+H/2; n.ss=s; n.vzc=vz;
}
function projectAll(){
  FL=Math.min(W,H)*1.12;
  for(const n of nodes)project(n);
}
function fog(vz){ /* 奥行き減衰 0..1 */
  const f=(vz-cam.dist*.55)/(cam.dist*1.1);
  return 1-Math.max(0,Math.min(.72,f));
}
function boundR(){
  let m=0;for(const n of nodes){const d=n.x*n.x+n.y*n.y+n.z*n.z;if(d>m)m=d;}
  return Math.sqrt(m);
}
function fitView(){camT={th:cam.th,ph:cam.ph,dist:Math.max(600,boundR()*2.55)};}

function focusNode(i){
  const n=nodes[i];

  const rz=Math.hypot(n.x,n.z);
  const ph=Math.max(-1.3,Math.min(1.3,Math.atan2(n.y,rz)));

}

const nState=new Uint8Array(N), eState=new Uint8Array(links.length);
function recomputeState(){
  const focus=sel>=0?sel:hov;
  const ego=focus>=0?nbrs[focus]:null;
  for(let i=0;i<N;i++){
    const n=nodes[i];
    if(pkgOff.has(n.pkg)){nState[i]=0;continue;}
    if(q){nState[i]=matches.has(i)?3:1;continue;}
    if(focus>=0){nState[i]=i===focus?3:(ego.has(i)?2:1);continue;}
    nState[i]=2;
  }
  for(let e=0;e<links.length;e++){
    const l=links[e];
    if(typeOff.has(l.k)||nState[l.s]===0||nState[l.t]===0){eState[e]=0;continue;}
    if(focus>=0&&!q)eState[e]=(l.s===focus||l.t===focus)?3:1;
    else if(q)eState[e]=(matches.has(l.s)||matches.has(l.t))?2:1;
    else eState[e]=2;
  }
  stateDirty=false;
}

/* ============ 発火エンジン ============ */
const pulses=[];
let AC=null,lastSnd=0;
function crackle(vol){
  if(!sndOn||!AC)return;
  const t=performance.now();if(t-lastSnd<22)return;lastSnd=t;
  const dur=.03+Math.random()*.04;
  const buf=AC.createBuffer(1,Math.max(64,AC.sampleRate*dur|0),AC.sampleRate);
  const d=buf.getChannelData(0);
  for(let i=0;i<d.length;i++)d[i]=(Math.random()*2-1)*Math.pow(1-i/d.length,2.2);
  const src=AC.createBufferSource();src.buffer=buf;
  const bp=AC.createBiquadFilter();bp.type="bandpass";
  bp.frequency.value=1100+Math.random()*2800;bp.Q.value=1.4;
  const g=AC.createGain();g.gain.value=vol;
  src.connect(bp);bp.connect(g);g.connect(AC.destination);src.start();
}
function fire(i,depth,budget,micro){
  const n=nodes[i],t=performance.now();
  if(nState[i]===0)return;
  if(t<n.refr)return;
  n.refr=t+360+Math.random()*340;
  n.pot=1;n.fireT=t;
  spikes++;
  if(!(spikes&3))document.getElementById("stSp").textContent=spikes.toLocaleString();
  crackle(micro?.03:.1*Math.min(1,n.r/7)+.04);
  if(micro||depth>=8||budget.n<=0)return;
  const outs=outAdj[i].filter(e=>eState[e]>0);
  /* shuffle */
  for(let k=outs.length-1;k>0;k--){const j=(Math.random()*(k+1))|0;const tmp=outs[k];outs[k]=outs[j];outs[j]=tmp;}
  const p=Math.pow(.86,depth);
  let br=0;
  for(const e of outs){
    if(br>=4||budget.n<=0)break;
    if(Math.random()>p)continue;
    const l=links[e];
    const tn=nodes[l.t];
    if(performance.now()<tn.refr)continue;
    budget.n--;br++;
    const d=Math.hypot(tn.x-n.x,tn.y-n.y,tn.z-n.z);
    pulses.push({e,t0:t,dur:Math.max(150,Math.min(560,d*2.1)),depth:depth+1,budget});
  }
}
const SCEN={
  recall:["hosts/hook_dispatcher","recall/recall_runtime"],
  save:["hosts/codex_record","hosts/claude_code_record"],
  ingest:["ingest/ingest_drain","ingest/orchestrator"]
};
function stimulate(name){
  const budget={n:150};
  let seeded=false;
  for(const id of (SCEN[name]||[])){
    const n=byId.get(id);
    if(n&&nState[n.i]>0){fire(n.i,0,budget);seeded=true;}
  }
  if(!seeded){ /* fallback: 可視ノードで最大fan-out */
    let best=-1,bf=-1;
    for(const n of nodes)if(nState[n.i]>0&&n.fo>bf){bf=n.fo;best=n.i;}
    if(best>=0)fire(best,0,budget);
  }
  flashTicker(`⚡ ${name.toUpperCase()} stimulus → cascade`);
}
/* ambient micro-firing: 常時パチパチ */
let ambAcc=0;
function ambient(dt){
  ambAcc+=dt;
  while(ambAcc>150){
    ambAcc-=150;
    for(let k=0;k<2;k++){
      if(Math.random()>.75)continue;
      const i=(Math.random()*N)|0;
      if(nState[i]===0)continue;
      const n=nodes[i],t=performance.now();
      if(t<n.refr)continue;
      if(Math.random()<.16){fire(i,6,{n:6});} /* たまに1-2ホップ延焼 */
      else{
        n.refr=t+300;n.pot=Math.max(n.pot,.5+Math.random()*.25);n.fireT=t;
        spikes++;
        if(!(spikes&7))document.getElementById("stSp").textContent=spikes.toLocaleString();
        crackle(.022);
      }
    }
  }
}
/* auto stimulus */
let autoAcc=0,autoIdx=0;
const AUTO_SEQ=["recall","save","recall","ingest"];
function autoTick(dt){
  if(!autoStim)return;
  autoAcc+=dt;
  if(autoAcc>6400){autoAcc=0;stimulate(AUTO_SEQ[autoIdx++%AUTO_SEQ.length]);}
}

/* ============ render ============ */
const drawOrder=nodes.map((_,i)=>i);
let tPrev=performance.now(),simAccum=0;
function frame(tNow){
  const dt=Math.min(60,tNow-tPrev);tPrev=tNow;
  simAccum+=dt;
  while(simAccum>15){tick();simAccum-=15;}
  if(autoRot&&!dragging&&tNow-lastInteract>2600)cam.th+=dt*.000045;
  if(camT){
    cam.th=angLerp(cam.th,camT.th,.1);
    cam.ph+=(camT.ph-cam.ph)*.1;
    cam.dist+=(camT.dist-cam.dist)*.1;
    if(Math.abs(camT.dist-cam.dist)<2&&Math.abs(camT.ph-cam.ph)<.005&&
       Math.abs(((camT.th-cam.th+Math.PI*3)%(Math.PI*2))-Math.PI)<.005)camT=null;
  }
  if(stateDirty)recomputeState();
  ambient(dt);autoTick(dt);
  /* potential decay */
  const dec=Math.exp(-dt/430);
  for(const n of nodes)if(n.pot>.003)n.pot*=dec;
  projectAll();
  draw(tNow);
  requestAnimationFrame(frame);
}

function draw(time){
  ctx.setTransform(DPR,0,0,DPR,0,0);
  ctx.clearRect(0,0,W,H);

  /* stars */
  ctx.fillStyle="#7d92b5";
  for(const s of stars){
    ctx.globalAlpha=.05+.06*Math.sin(time*.001*s.sp+s.p);
    ctx.beginPath();ctx.arc(s.x*W,s.y*H,s.r,0,7);ctx.fill();
  }
  ctx.globalAlpha=1;

  /* ---- edges: 奥行きバンド×状態でバッチ ---- */
  const bandA=[.085,.05,.024];
  for(let st=1;st<=3;st++){
    for(let band=2;band>=0;band--){
      let began=false;
      for(let e=0;e<links.length;e++){
        if(eState[e]!==st)continue;
        const l=links[e],a=nodes[l.s],b=nodes[l.t];
        if(a.vzc>9e8||b.vzc>9e8)continue;
        const vz=(a.vzc+b.vzc)/2;
        const bd=vz<cam.dist*.85?0:vz<cam.dist*1.15?1:2;
        if(bd!==band)continue;
        if((a.sx<-40&&b.sx<-40)||(a.sx>W+40&&b.sx>W+40)||
           (a.sy<-40&&b.sy<-40)||(a.sy>H+40&&b.sy>H+40))continue;
        if(!began){
          ctx.beginPath();began=true;
          ctx.lineWidth=st===3?1.3:.7+Math.max(0,edgeVis-1)*.28;
          let base=st===3?.42:st===2?bandA[band]*edgeVis:bandA[band]*.35*edgeVis;
          if(base>.85)base=.85;
          ctx.strokeStyle=st===3?rgba(RGB_FIRE,base):rgba(RGB_STEEL,base);
          ctx.setLineDash(l.k===1?[3,5]:[]);
        }
        ctx.moveTo(a.sx,a.sy);ctx.lineTo(b.sx,b.sy);
      }
      if(began)ctx.stroke();
    }
  }
  ctx.setLineDash([]);

  /* ---- spike pulses ---- */
  ctx.globalCompositeOperation="lighter";
  const now=time;
  for(let pi=pulses.length-1;pi>=0;pi--){
    const p=pulses[pi];
    const l=links[p.e],a=nodes[l.s],b=nodes[l.t];
    const tt=(now-p.t0)/p.dur;
    if(tt>=1){
      pulses.splice(pi,1);
      fire(l.t,p.depth,p.budget);
      continue;
    }
    if(a.vzc>9e8||b.vzc>9e8)continue;
    const t2=Math.max(0,tt-.09);
    const x1=a.x+(b.x-a.x)*tt, y1=a.y+(b.y-a.y)*tt, z1=a.z+(b.z-a.z)*tt;
    const x0=a.x+(b.x-a.x)*t2, y0=a.y+(b.y-a.y)*t2, z0=a.z+(b.z-a.z)*t2;
    /* project both */
    const cT=Math.cos(cam.th),sT=Math.sin(cam.th),cP=Math.cos(cam.ph),sP=Math.sin(cam.ph);
    const pr=(x,y,z)=>{
      const xr=x*cT+z*sT,zr=-x*sT+z*cT;
      const yr=y*cP-zr*sP,zr2=y*sP+zr*cP;
      const vz=cam.dist-zr2;if(vz<60)return null;
      const s=FL/vz;return [xr*s+W/2,yr*s+H/2,s,vz];
    };
    const P1=pr(x1,y1,z1),P0=pr(x0,y0,z0);
    if(!P1)continue;
    const am=Math.sin(Math.PI*tt)*fog(P1[3]);
    if(P0){
      ctx.strokeStyle=rgba(RGB_FIRE,.55*am);
      ctx.lineWidth=1.4;
      ctx.beginPath();ctx.moveTo(P0[0],P0[1]);ctx.lineTo(P1[0],P1[1]);ctx.stroke();
    }
    const gs=(10+8*am)*P1[2]*1.6;
    ctx.globalAlpha=.85*am;
    ctx.drawImage(GLOW_FIRE,P1[0]-gs/2,P1[1]-gs/2,gs,gs);
    ctx.globalAlpha=1;
  }

  /* ---- nodes: 奥から描画 ---- */
  drawOrder.sort((i,j)=>nodes[j].vzc-nodes[i].vzc);
  for(const i of drawOrder){
    const n=nodes[i],st=nState[i];
    if(st===0||n.vzc>9e8)continue;
    if(n.sx<-60||n.sx>W+60||n.sy<-60||n.sy>H+60)continue;
    const fg=fog(n.vzc);
    const rs=Math.max(1.1,n.r*n.ss);
    const dimF=st===1?.28:1;
    const pot=n.pot;
    /* glow */
    if(pot>.03){
      const gs=rs*(4+10*pot);
      ctx.globalAlpha=Math.min(1,pot*1.15)*fg*dimF;
      ctx.drawImage(pot>.6?GLOW_HOT:GLOW_FIRE,n.sx-gs/2,n.sy-gs/2,gs,gs);
    } else if(st===3||n.fi>=38){
      const gs=rs*3.4;
      ctx.globalAlpha=(st===3?.5:.14)*fg*dimF;
      ctx.drawImage(GLOW_STEEL,n.sx-gs/2,n.sy-gs/2,gs,gs);
    }
    ctx.globalAlpha=1;
    /* core */
    let col;
    if(pot>.5)col=mix(RGB_FIRE,RGB_HOT,(pot-.5)*2);
    else if(pot>.04)col=mix(n.base,RGB_FIRE,pot*2);
    else col=n.base;
    const aCore=(st===1?.22:st===3?1:.62+.38*Math.min(1,pot*3))*fg;
    ctx.globalCompositeOperation=pot>.04?"lighter":"source-over";
    ctx.fillStyle=rgba(col,aCore);
    ctx.beginPath();ctx.arc(n.sx,n.sy,rs,0,7);ctx.fill();
    if(pot>.35){
      ctx.fillStyle=rgba(RGB_HOT,pot*fg);
      ctx.beginPath();ctx.arc(n.sx,n.sy,rs*.45,0,7);ctx.fill();
    }
    ctx.globalCompositeOperation="lighter";
    /* fire flash ring */
    const age=time-n.fireT;
    if(age<450&&pot>.1){
      const k=age/450;
      ctx.strokeStyle=rgba(RGB_FIRE,(1-k)*.55*fg);
      ctx.lineWidth=1.2;
      ctx.beginPath();ctx.arc(n.sx,n.sy,rs+k*26*Math.min(1.6,n.ss*2),0,7);ctx.stroke();
    }
    ctx.globalCompositeOperation="source-over";
    /* selection ring */
    if(i===sel){
      ctx.strokeStyle=rgba(RGB_FIRE,.95);
      ctx.lineWidth=1.6;
      ctx.beginPath();ctx.arc(n.sx,n.sy,rs+5+Math.sin(time*.005)*1.5,0,7);ctx.stroke();
    }
  }

  /* ---- labels ---- */
  ctx.font="10.5px "+getComputedStyle(document.body).getPropertyValue("--mono");
  ctx.textAlign="center";
  for(const n of nodes){
    const st=nState[n.i];
    if(st<2||n.vzc>9e8)continue;
    const hot=n.pot>.5;
    const show=st===3||hot||(n.fi>=34&&cam.dist<1500&&n.vzc<cam.dist);
    if(!show)continue;
    const y=n.sy-n.r*n.ss-7;
    if(n.sx<-40||n.sx>W+40||y<-20||y>H+20)continue;
    const fg=fog(n.vzc);
    const w=ctx.measureText(n.name).width;
    ctx.fillStyle=`rgba(3,5,10,${.7*fg})`;
    ctx.fillRect(n.sx-w/2-3,y-9,w+6,12);
    ctx.fillStyle=hot||st===3?rgba(RGB_FIRE,Math.max(.5,n.pot)*fg+.2):rgba([160,178,210],.8*fg);
    ctx.fillText(n.name,n.sx,y);
  }
}

/* ============ interaction ============ */
let downPt=null,moved=false;
function pick(mx,my){
  let best=-1,bd=1e9;
  for(const n of nodes){
    if(nState[n.i]===0||n.vzc>9e8)continue;
    const d=Math.hypot(n.sx-mx,n.sy-my)-Math.max(5,n.r*n.ss);
    if(d<4&&n.vzc<bd+1e5&&d<bd){bd=d;best=n.i;}
  }
  return best;
}
const tip=document.getElementById("tooltip");
cv.addEventListener("pointerdown",e=>{
  cv.setPointerCapture(e.pointerId);
  downPt={x:e.offsetX,y:e.offsetY};moved=false;dragging=true;lastInteract=performance.now();
});
cv.addEventListener("pointermove",e=>{
  const mx=e.offsetX,my=e.offsetY;
  if(downPt&&Math.hypot(mx-downPt.x,my-downPt.y)>4)moved=true;
  if(downPt&&moved){
    cam.th-=e.movementX*.0045;
    cam.ph=Math.max(-1.35,Math.min(1.35,cam.ph+e.movementY*.0045));
    camT=null;lastInteract=performance.now();
    return;
  }
  const p=pick(mx,my);
  if(p!==hov){hov=p;stateDirty=true;}
  if(p>=0){
    const n=nodes[p];
    tip.style.display="block";
    tip.style.left=Math.min(W-240,mx+16)+"px";
    tip.style.top=Math.max(8,my-14)+"px";
    tip.innerHTML=`<div class="t">${n.id}</div><div class="s">${n.l.toLocaleString()} lines · in ${n.fi} / out ${n.fo}${n.ep?" · entrypoint":""}</div>`;
    cv.style.cursor="pointer";
  }else{tip.style.display="none";cv.style.cursor="grab";}
});
cv.addEventListener("pointerup",e=>{
  if(!moved){
    const p=pick(e.offsetX,e.offsetY);
    select(p);
    if(p>=0)fire(p,0,{n:90}); /* つついたニューロンは発火する */
  }
  downPt=null;dragging=false;lastInteract=performance.now();
});
cv.addEventListener("dblclick",e=>{
  const p=pick(e.offsetX,e.offsetY);
  if(p>=0)focusNode(p);else fitView();
});
cv.addEventListener("wheel",e=>{
  e.preventDefault();lastInteract=performance.now();
  cam.dist=Math.max(240,Math.min(4200,cam.dist*Math.exp(e.deltaY*.0011)));
  camT=null;
},{passive:false});

let gaugeAnim=0;
function drawGauge(){
  const g=document.getElementById("gauge");if(!g)return;
  const c=g.getContext("2d");
  const st=DATA.meta.static,df=DATA.meta.deferred;
  const target=st/(st+df);
  gaugeAnim=0;
  (function step(){
    if(!document.getElementById("gauge"))return;
    gaugeAnim=Math.min(1,gaugeAnim+.03);
    const v=target*(1-Math.pow(1-gaugeAnim,3));
    c.setTransform(2,0,0,2,0,0);c.clearRect(0,0,118,118);
    const cx=59,cy=59;
    c.strokeStyle="rgba(110,140,190,.1)";c.lineWidth=1;
    for(let i=0;i<40;i++){
      const a=i/40*Math.PI*2;
      c.beginPath();
      c.moveTo(cx+Math.cos(a)*52,cy+Math.sin(a)*52);
      c.lineTo(cx+Math.cos(a)*55,cy+Math.sin(a)*55);
      c.stroke();
    }
    const a0=-Math.PI/2;
    c.lineWidth=7;c.lineCap="round";
    c.strokeStyle="rgba(125,146,181,.16)";
    c.beginPath();c.arc(cx,cy,44,a0,a0+Math.PI*2);c.stroke();
    const grd=c.createLinearGradient(0,0,118,118);
    grd.addColorStop(0,"#ffb454");grd.addColorStop(1,"#f5934b");
    c.strokeStyle=grd;c.shadowColor="rgba(255,180,84,.6)";c.shadowBlur=8;
    c.beginPath();c.arc(cx,cy,44,a0,a0+Math.PI*2*v);c.stroke();
    c.shadowBlur=0;
    c.fillStyle="#ffd9a0";c.font="700 19px "+getComputedStyle(document.body).getPropertyValue("--mono");
    c.textAlign="center";c.fillText(Math.round(v*100)+"%",cx,cy+2);
    c.fillStyle="rgba(127,144,176,.9)";c.font="7.5px "+getComputedStyle(document.body).getPropertyValue("--mono");
    c.fillText("STATIC BIND",cx,cy+16);
    if(gaugeAnim<1)requestAnimationFrame(step);
  })();
}

/* ============ search ============ */
const searchEl=document.getElementById("search"),hitsEl=document.getElementById("searchHits");
searchEl.addEventListener("input",()=>{
  q=searchEl.value.trim().toLowerCase();
  matches=new Set();
  if(q)nodes.forEach(n=>{if(n.id.toLowerCase().includes(q))matches.add(n.i);});
  hitsEl.textContent=q?matches.size+" hits":"";
  stateDirty=true;
});
searchEl.addEventListener("keydown",e=>{
  if(e.key==="Enter"&&matches.size)select([...matches][0]);
  if(e.key==="Escape"){searchEl.value="";q="";matches.clear();hitsEl.textContent="";stateDirty=true;searchEl.blur();}
});
window.addEventListener("keydown",e=>{
  if((e.metaKey||e.ctrlKey)&&e.key==="k"){e.preventDefault();searchEl.focus();searchEl.select();}
  else if(e.key==="Escape"&&document.activeElement!==searchEl)select(-1);
});

/* ============ controls ============ */
document.getElementById("mOrganic").addEventListener("click",()=>setMode("organic"));
document.getElementById("mCluster").addEventListener("click",()=>setMode("cluster"));
function setMode(m){
  mode=m;reheat(.7);
  document.getElementById("mOrganic").classList.toggle("on",m==="organic");
  document.getElementById("mCluster").classList.toggle("on",m==="cluster");
  setTimeout(fitView,900);
}
document.querySelectorAll(".stim").forEach(b=>{
  b.addEventListener("click",()=>stimulate(b.dataset.s));
});
const tAuto=document.getElementById("tAuto");
tAuto.addEventListener("click",()=>{autoStim=!autoStim;tAuto.classList.toggle("on",autoStim);});
const tRot=document.getElementById("tRot");
tRot.addEventListener("click",()=>{autoRot=!autoRot;tRot.classList.toggle("on",autoRot);});
const tSnd=document.getElementById("tSnd");
tSnd.addEventListener("click",()=>{
  sndOn=!sndOn;tSnd.classList.toggle("on",sndOn);
  if(sndOn){
    if(!AC)AC=new (window.AudioContext||window.webkitAudioContext)();
    if(AC.state==="suspended")AC.resume();
  }
});
document.getElementById("visSlider").addEventListener("input",e=>{edgeVis=e.target.value/100;});
document.getElementById("zIn").addEventListener("click",()=>{cam.dist=Math.max(240,cam.dist/1.4);camT=null;});
document.getElementById("zOut").addEventListener("click",()=>{cam.dist=Math.min(4200,cam.dist*1.4);camT=null;});
document.getElementById("zFit").addEventListener("click",()=>{select(-1);fitView();});

/* ============ ticker ============ */
const store=byId.get("core/store");
const facts=[
  "記憶皮質オンライン — 依存エッジ沿いにスパイク伝播中",
  `core/store fan-in ${store?store.fi:"—"} — 最深部のハブニューロン`,
  `${N} neurons / ${(DATA.meta.static+DATA.meta.deferred).toLocaleString()} synapses`,
  "⚡ボタンで recall / save / ingest 経路を刺激",
  "ニューロンをクリックすると発火して連鎖します",
  "ドラッグで回転 · ホイールでズーム · ⌘K で検索",
  `総行数 ${DATA.meta.totalLines.toLocaleString()} lines @ ${DATA.meta.commit}`,
];
let fIdx=0;
const tx=document.getElementById("tickerTx");
function nextFact(){tx.style.opacity=0;setTimeout(()=>{tx.textContent=facts[fIdx++%facts.length];tx.style.opacity=1;},350);}
let tickerHold=0;
function flashTicker(msg){
  tx.style.opacity=0;
  setTimeout(()=>{tx.textContent=msg;tx.style.opacity=1;},200);
  tickerHold=performance.now()+3500;
}
nextFact();
setInterval(()=>{if(performance.now()>tickerHold)nextFact();},4600);

/* ============ boot ============ */
for(let i=0;i<180;i++)tick();
fitView();cam.dist=camT.dist;camT=null;
renderPanel();
requestAnimationFrame(t=>{tPrev=t;frame(t);});
setTimeout(()=>stimulate("recall"),1400);
</script>
