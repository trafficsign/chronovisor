use_default_settings: true

general:
  debug: false
  instance_name: "Chronovisor Search"
  enable_metrics: false

search:
  safe_search: 1
  formats:
    - json

server:
  bind_address: "127.0.0.1"
  port: 8888
  base_url: "http://127.0.0.1:8888/"
  limiter: false
  public_instance: false
  secret_key: "overridden-by-CHRONOVISOR-runtime"
  image_proxy: false
  method: "GET"

outgoing:
  request_timeout: 4.0
  max_request_timeout: 8.0
