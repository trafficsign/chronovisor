[project]
name = "chronovisor"
version = "0.2.0"
description = "Chronovisor - provenance-first agentic memory for local AI systems"
requires-python = ">=3.14,<3.15"
dependencies = [
    "mcp>=1.30.0,<2",
    "pyyaml>=6.0.3",
    "zstandard>=0.23.0",
]

[project.scripts]
chronovisor-dashboard = "chronovisor.surface.dashboard:main"
chronovisor-mcp = "chronovisor.surface.mcp_server:main"
chronovisor-hook = "chronovisor.surface.hook_dispatcher:main"
chronovisor-codex-record = "chronovisor.hosts.codex_record:main"
chronovisor-claude-code-record = "chronovisor.hosts.claude_code_record:main"
chronovisor-session-sweeper = "chronovisor.capture.session_sweeper:main"
chronovisor-capture = "chronovisor.capture.cycle:main"
chronovisor-search-eval = "chronovisor.surface.search_eval:main"
chronovisor-background-jobs = "chronovisor.capture.background_jobs:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/chronovisor"]

[dependency-groups]
dev = [
    "import-linter>=2.9",
    "mypy>=2.3.0",
    "pytest>=9.0.3",
    "ruff>=0.16.0",
]

[tool.pytest.ini_options]
markers = [
    "darwin_contract: requires the Darwin/APFS platform contract",
]

[tool.importlinter]
root_package = "chronovisor"

[tool.ruff]
target-version = "py314"
line-length = 88

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP", "B", "SIM", "RUF100"]
ignore = ["UP042", "SIM105", "SIM115", "SIM117"]

[tool.ruff.lint.per-file-ignores]
# TYPE_CHECKING-only names must stay strings for runtime signature inspection.
"src/chronovisor/pages/store.py" = ["UP037"]

[tool.mypy]
files = [
    "src/chronovisor/common/__init__.py",
    "src/chronovisor/common/canonical_json.py",
    "src/chronovisor/common/canonical_document.py",
    "src/chronovisor/common/durable_state.py",
    "src/chronovisor/common/hashutil.py",
    "src/chronovisor/common/timeutil.py",
    "src/chronovisor/common/config.py",
    "src/chronovisor/common/paths.py",
    "src/chronovisor/raw/raw_segment.py",
    "src/chronovisor/raw/raw_store.py",
    "src/chronovisor/raw/legacy_archive.py",
    "src/chronovisor/raw/legacy_frontmatter.py",
    "src/chronovisor/raw/sealed_artifact_decoder.py",
    "src/chronovisor/raw/save_transaction.py",
    "src/chronovisor/capture/transcript.py",
    "src/chronovisor/capture/claude_code_transcript.py",
    "src/chronovisor/capture/codex_transcript.py",
    "src/chronovisor/capture/background_jobs.py",
    "src/chronovisor/capture/capture_status.py",
    "src/chronovisor/pages/page_identity.py",
    "src/chronovisor/pages/frontmatter.py",
    "src/chronovisor/pages/markdown_sections.py",
    "src/chronovisor/pages/link_fix.py",
    "src/chronovisor/pages/store.py",
    "src/chronovisor/index/index_store.py",
    "src/chronovisor/index/lexical_index.py",
    "src/chronovisor/index/page_registry.py",
    "src/chronovisor/index/alias_store.py",
    "src/chronovisor/index/search_types.py",
    "src/chronovisor/search/search.py",
]
strict = true
show_error_codes = true
warn_unused_configs = true

[[tool.importlinter.contracts]]
name = "Pipeline layers"
type = "layers"
layers = [
    "chronovisor.surface | chronovisor.hosts",
    "chronovisor.search",
    "chronovisor.index",
    "chronovisor.pages | chronovisor.capture",
    "chronovisor.raw",
    "chronovisor.common",
]
