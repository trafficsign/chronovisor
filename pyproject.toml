[project]
name = "llm-wiki-mcp"
version = "0.1.0"
description = "LLM Wiki MCP Server - Karpathy-inspired knowledge management for Claude Code"
requires-python = ">=3.11"
dependencies = [
    "mcp>=1.0.0",
    "httpx>=0.27.0",
]

[project.scripts]
llm-wiki-mcp = "llm_wiki_mcp.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
