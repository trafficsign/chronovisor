[project]
name = "chronovisor"
version = "0.2.0"
description = "Chronovisor - provenance-first agentic memory for local AI systems"
requires-python = ">=3.14,<3.15"
dependencies = [
    "mcp>=1.30.0,<2",
    "numpy>=2.0.0",
    "pyyaml>=6.0.3",
    "zstandard>=0.23.0",
]

[project.optional-dependencies]
semantic = [
    "setuptools>=83.0.0",
    "torch==2.13.0",
    "transformers==5.14.1",
    "sentence-transformers==5.6.1",
    "usearch>=2.20.0",
    "mlx==0.32.2; sys_platform == 'darwin'",
    "mlx-lm==0.31.3; sys_platform == 'darwin'",
]
[project.scripts]
chronovisor-dashboard = "chronovisor.ops.dashboard:main"
chronovisor-mcp = "chronovisor.hosts.server:main"
chronovisor-hook = "chronovisor.hosts.hook_dispatcher:main"
chronovisor-codex-record = "chronovisor.hosts.codex_record:main"
chronovisor-claude-code-record = "chronovisor.hosts.claude_code_record:main"
chronovisor-session-sweeper = "chronovisor.ops.session_sweeper:main"
chronovisor-capture = "chronovisor.ops.capture:main"
chronovisor-background-jobs = "chronovisor.ops.background_jobs:main"
chronovisor-semantic-service = "chronovisor.search.semantic_service:main"
chronovisor-reranker-service = "chronovisor.search.reranker_service:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/chronovisor"]

[dependency-groups]
dev = [
    "import-linter>=2.9",
    "mypy>=2.3.0",
    "pytest>=9.0.3",
    "ruff>=0.16.0",
]

[tool.pytest.ini_options]
markers = [
    "darwin_contract: requires the Darwin/APFS platform contract",
]

[tool.importlinter]
root_package = "chronovisor"

[tool.ruff]
target-version = "py314"
line-length = 88

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP", "B", "SIM", "RUF100"]
ignore = ["UP042", "SIM105", "SIM115", "SIM117"]

[tool.ruff.lint.per-file-ignores]
# TYPE_CHECKING-only names must stay strings for runtime signature inspection.
"src/chronovisor/core/store.py" = ["UP037"]

[tool.mypy]
files = ["src/chronovisor/core"]
strict = true
show_error_codes = true
warn_unused_configs = true

[[tool.importlinter.contracts]]
name = "Core cannot depend on domain or outer layers"
type = "forbidden"
source_modules = ["chronovisor.core"]
forbidden_modules = [
    "chronovisor.raw",
    "chronovisor.search",
    "chronovisor.ops",
    "chronovisor.hosts",
]
