[project]
name = "chronovisor"
version = "0.1.9"
description = "Chronovisor - provenance-first agentic memory for local AI systems"
requires-python = ">=3.11"
dependencies = [
    "mcp>=1.0.0",
    "httpx>=0.27.0",
    "numpy>=2.0.0",
    "zstandard>=0.23.0",
]

[project.optional-dependencies]
reranker = [
    "torch>=2.2.0",
    "transformers>=4.40.0",
]
semantic = [
    "torch==2.13.0",
    "transformers==5.14.1",
    "sentence-transformers==5.6.1",
    "usearch>=2.20.0",
]

[project.scripts]
chronovisor = "chronovisor.cli:main"
chronovisor-mcp = "chronovisor.server:main"
chronovisor-hook = "chronovisor.hook_dispatcher:main"
chronovisor-codex-record = "chronovisor.codex_record:main"
chronovisor-claude-code-record = "chronovisor.claude_code_record:main"
chronovisor-ingest-drain = "chronovisor.ingest_drain:main"
chronovisor-dashboard = "chronovisor.dashboard:main"
chronovisor-self-heal = "chronovisor.self_heal:main"
chronovisor-recall = "chronovisor.recall_runtime:main"
chronovisor-recall-audit = "chronovisor.recall_auditor:main"
chronovisor-recall-auto-apply = "chronovisor.recall_auto_apply:main"
chronovisor-recall-eval = "chronovisor.recall_eval:main"
chronovisor-recall-calibrate = "chronovisor.recall_calibration:main"
chronovisor-recall-improve = "chronovisor.recall_improvement:main"
chronovisor-content-correction = "chronovisor.content_correction:main"
chronovisor-content-correction-eval = "chronovisor.content_correction_eval:main"
chronovisor-eval = "chronovisor.search_eval:main"
chronovisor-duplicate-review = "chronovisor.duplicate_review:main"
chronovisor-entities = "chronovisor.entities:main"
chronovisor-snapshot = "chronovisor.snapshot:main"
chronovisor-raw-replay = "chronovisor.raw_replay:main"
chronovisor-memory-integrity = "chronovisor.memory_integrity:main"
chronovisor-cofire = "chronovisor.cofire:main"
chronovisor-prefetch = "chronovisor.prefetch:main"
chronovisor-sleep = "chronovisor.sleep_cycle:main"
chronovisor-claims = "chronovisor.claims:main"
chronovisor-golden-expand = "chronovisor.golden_expand:main"
chronovisor-retention = "chronovisor.retention:main"
chronovisor-reflect = "chronovisor.reflection:main"
chronovisor-hubs = "chronovisor.hubs:main"
chronovisor-autonomy = "chronovisor.autonomy:main"
chronovisor-converge = "chronovisor.converge_worker:main"
chronovisor-session-sweeper = "chronovisor.session_sweeper:main"
chronovisor-background-jobs = "chronovisor.background_jobs:main"
chronovisor-model-lab = "chronovisor.model_lab:main"
chronovisor-local-model-eval = "chronovisor.local_model_eval:main"
chronovisor-adoption-corpus = "chronovisor.adoption_corpus:main"
chronovisor-page-normalize = "chronovisor.page_normalize:main"
chronovisor-metadata-backfill = "chronovisor.metadata_backfill:main"
chronovisor-distill = "chronovisor.distill:main"
chronovisor-oracle = "chronovisor.oracle:main"
chronovisor-burn-monitor = "chronovisor.burn_monitor:main"
chronovisor-repair-runbook = "chronovisor.repair_runbook:main"
chronovisor-research-verify = "chronovisor.research_verification:main"
chronovisor-research-eval = "chronovisor.research_eval:main"
chronovisor-research = "chronovisor.research_service:main"
chronovisor-semantic-service = "chronovisor.semantic_service:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel.force-include]
"tests/fixtures/research_holdout.jsonl" = "chronovisor/fixtures/research_holdout.jsonl"

[dependency-groups]
dev = [
    "pytest>=9.0.3",
]
