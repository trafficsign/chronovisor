[project]
name = "llm-wiki-mcp"
version = "0.1.0"
description = "LLM Wiki MCP Server - Karpathy-inspired knowledge management for Claude Code"
requires-python = ">=3.11"
dependencies = [
    "mcp>=1.0.0",
    "httpx>=0.27.0",
]

[project.optional-dependencies]
reranker = [
    "torch>=2.2.0",
    "transformers>=4.40.0",
]

[project.scripts]
llm-wiki = "llm_wiki_mcp.cli:main"
llm-wiki-mcp = "llm_wiki_mcp.server:main"
llm-wiki-hook = "llm_wiki_mcp.hook_dispatcher:main"
llm-wiki-codex-save = "llm_wiki_mcp.codex_save:main"
llm-wiki-claude-code-save = "llm_wiki_mcp.claude_code_save:main"
llm-wiki-ingest-drain = "llm_wiki_mcp.ingest_drain:main"
llm-wiki-dashboard = "llm_wiki_mcp.dashboard:main"
llm-wiki-self-heal = "llm_wiki_mcp.self_heal:main"
llm-wiki-recall = "llm_wiki_mcp.recall_runtime:main"
llm-wiki-recall-audit = "llm_wiki_mcp.recall_auditor:main"
llm-wiki-recall-auto-apply = "llm_wiki_mcp.recall_auto_apply:main"
llm-wiki-recall-eval = "llm_wiki_mcp.recall_eval:main"
llm-wiki-recall-calibrate = "llm_wiki_mcp.recall_calibration:main"
llm-wiki-recall-improve = "llm_wiki_mcp.recall_improvement:main"
llm-wiki-eval = "llm_wiki_mcp.search_eval:main"
llm-wiki-duplicate-review = "llm_wiki_mcp.duplicate_review:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "pytest>=9.0.3",
]
